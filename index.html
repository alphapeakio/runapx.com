<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APX — Running Group</title>
  <meta name="description" content="APX (Apex) Running Group — precision, pace, and community.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/assets/apx-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #000000;
      --white: #ffffff;
      --muted: #9a9a9a;
      --dim: #555555;
      --accent: #0099ff;
      --accent-glow: rgba(0, 153, 255, 0.35);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 200;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle radial glow behind content */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 50% 42%, rgba(0, 153, 255, 0.06) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 50% 45%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Fine grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.5rem;
    }

    .logo-wrap {
      position: relative;
      opacity: 0;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -20% -10%;
      background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo {
      position: relative;
      display: block;
      width: min(420px, 80vw);
      aspect-ratio: 1212 / 316;
      /* Use the wordmark shape as an alpha mask so we can fill it
         with a brushed-metal gradient instead of flat white. */
      -webkit-mask: url("/assets/apx-logo.png") center / contain no-repeat;
              mask: url("/assets/apx-logo.png") center / contain no-repeat;
      /* Metallic silver: alternating bright and shaded bands */
      background: linear-gradient(
        176deg,
        #ffffff 0%,
        #d6d6d6 16%,
        #8c8c8c 32%,
        #f4f4f4 49%,
        #767676 60%,
        #b4b4b4 76%,
        #ececec 100%
      );
      opacity: 0.95;
    }

    /* Sheen highlight that sweeps down the wordmark, tracking the scan line */
    .logo::after {
      content: '';
      position: absolute;
      left: -10%;
      right: -10%;
      top: -60%;
      height: 55%;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(255, 255, 255, 0.15) 35%,
        rgba(255, 255, 255, 0.95) 50%,
        rgba(255, 255, 255, 0.15) 65%,
        transparent 100%
      );
      mix-blend-mode: screen;
      pointer-events: none;
      animation: sheen 8s linear infinite;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--dim), var(--accent), var(--dim), transparent);
      opacity: 0;
      animation: fadeIn 1s ease 0.8s forwards;
    }

    .title-block {
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    .title {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
    }

    .pronunciation {
      margin-top: 0.75rem;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 200;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .pronunciation span {
      color: var(--accent);
      font-weight: 400;
      text-shadow: 0 0 24px var(--accent-glow);
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: clamp(0.7rem, 1.8vw, 0.8rem);
      font-weight: 200;
      letter-spacing: 0.25em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* Animated laser scan line */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(0, 153, 255, 0.5) 15%,
        rgba(150, 220, 255, 0.9) 40%,
        #ffffff 50%,
        rgba(150, 220, 255, 0.9) 60%,
        rgba(0, 153, 255, 0.5) 85%,
        transparent 100%
      );
      box-shadow:
        0 0 8px 1px rgba(120, 200, 255, 0.9),
        0 0 22px 3px var(--accent-glow),
        0 0 44px 6px rgba(0, 153, 255, 0.25);
      animation: scan 8s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sheen {
      0%   { top: -60%; opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    @keyframes scan {
      0%   { top: -1px; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100dvh; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap, .divider, .title-block, .scanline {
        animation: none;
        opacity: 1;
      }
      .logo::after {
        animation: none;
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="scanline" aria-hidden="true"></div>

  <main class="page">
    <div class="logo-wrap">
      <div class="logo" role="img" aria-label="APX logo"></div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="title-block">
      <h1 class="title">APX Running Group</h1>
      <p class="tagline">Performance · Connection · Growth</p>
    </div>
  </main>
</body>
</html>
