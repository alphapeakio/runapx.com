<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APX — Running Group</title>
  <meta name="description" content="APX (Apex) Running Group — precision, pace, and community.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/assets/apx-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #000000;
      --white: #ffffff;
      --muted: #9a9a9a;
      --dim: #555555;
      --accent: #0099ff;
      --accent-glow: rgba(0, 153, 255, 0.35);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 200;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle radial glow behind content */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 50% 42%, rgba(0, 153, 255, 0.06) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 50% 45%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Fine grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.5rem;
    }

    .logo-wrap {
      position: relative;
      opacity: 0;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -20% -10%;
      background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo {
      position: relative;
      display: block;
      width: min(420px, 80vw);
      aspect-ratio: 1212 / 316;
      /* Use the wordmark shape as an alpha mask so we can fill it
         with a brushed-metal gradient instead of flat white. */
      -webkit-mask: url("/assets/apx-logo.png") center / contain no-repeat;
              mask: url("/assets/apx-logo.png") center / contain no-repeat;
      /* Metallic silver: alternating bright and shaded bands */
      background: linear-gradient(
        176deg,
        #ffffff 0%,
        #d6d6d6 16%,
        #8c8c8c 32%,
        #f4f4f4 49%,
        #767676 60%,
        #b4b4b4 76%,
        #ececec 100%
      );
      opacity: 0.95;
      overflow: hidden;
    }

    /* A glint of light that races across the wordmark — speed / performance. */
    .logo::after {
      content: '';
      position: absolute;
      top: -20%;
      bottom: -20%;
      left: -30%;
      width: 20%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255, 255, 255, 0.15) 40%,
        rgba(255, 255, 255, 0.95) 50%,
        rgba(255, 255, 255, 0.15) 60%,
        transparent 100%
      );
      transform: skewX(-18deg);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: gloss 6s cubic-bezier(0.7, 0, 0.3, 1) infinite;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--dim), var(--accent), var(--dim), transparent);
      opacity: 0;
      animation: fadeIn 1s ease 0.8s forwards;
    }

    .title-block {
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    .title {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
    }

    .pronunciation {
      margin-top: 0.75rem;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 200;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .pronunciation span {
      color: var(--accent);
      font-weight: 400;
      text-shadow: 0 0 24px var(--accent-glow);
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: clamp(0.7rem, 1.8vw, 0.8rem);
      font-weight: 200;
      letter-spacing: 0.25em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ── Race: light beams that sprint across the track ──
       Each streak has a bright leading head and a motion-blur tail,
       accelerating left→right at its own pace so they overtake. */
    .track {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .track.back  { z-index: 0; }  /* ambient depth, behind the content */
    .track.front { z-index: 2; }  /* hero lasers, over the content     */

    .streak {
      position: absolute;
      left: 0;
      top: var(--top, 50%);
      width: var(--w, 36vw);
      height: var(--h, 2px);
      border-radius: 999px;
      transform-origin: right center;
      transform: translateX(-55vw);
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(0, 153, 255, 0.04) 34%,
        rgba(0, 153, 255, 0.30) 62%,
        var(--core, rgba(150, 220, 255, 0.78)) 86%,
        var(--head, #eaf6ff) 100%
      );
      filter:
        drop-shadow(0 0 var(--g, 4px) var(--accent-glow))
        drop-shadow(0 0 calc(var(--g, 4px) * 2.4) rgba(0, 153, 255, 0.22));
      animation: race var(--dur, 3s) cubic-bezier(0.5, 0, 0.82, 0.3) var(--delay, 0s) infinite;
      will-change: transform, opacity;
    }

    /* Bright pin-point at the leading edge of each hero beam. */
    .track.front .streak::after {
      content: '';
      position: absolute;
      right: -2px;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px 2px rgba(150, 220, 255, 0.95), 0 0 22px 6px var(--accent-glow);
    }

    @keyframes race {
      0%   { transform: translateX(-55vw) scaleX(0.65); opacity: 0; }
      10%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateX(160vw) scaleX(1.25); opacity: 0; }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Light glint sprinting across the wordmark, with a pause between passes */
    @keyframes gloss {
      0%   { left: -30%; opacity: 0; }
      6%   { opacity: 1; }
      32%  { left: 120%; opacity: 1; }
      38%  { left: 120%; opacity: 0; }
      100% { left: 120%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap, .divider, .title-block {
        animation: none;
        opacity: 1;
      }
      .logo::after,
      .track {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient beams for depth, behind the content -->
  <div class="track back" aria-hidden="true">
    <span class="streak" style="--top:24%; --w:34vw; --h:1px; --dur:3.6s; --delay:.2s; --g:3px; --core:rgba(0,153,255,0.45); --head:rgba(150,220,255,0.85)"></span>
    <span class="streak" style="--top:41%; --w:28vw; --h:1px; --dur:4.2s; --delay:1.4s; --g:3px; --core:rgba(0,153,255,0.40); --head:rgba(150,220,255,0.75)"></span>
    <span class="streak" style="--top:63%; --w:40vw; --h:1px; --dur:3.9s; --delay:.7s; --g:3px; --core:rgba(0,153,255,0.45); --head:rgba(150,220,255,0.85)"></span>
    <span class="streak" style="--top:79%; --w:30vw; --h:1px; --dur:4.6s; --delay:2.1s; --g:3px; --core:rgba(0,153,255,0.38); --head:rgba(150,220,255,0.70)"></span>
  </div>

  <main class="page">
    <div class="logo-wrap">
      <div class="logo" role="img" aria-label="APX logo"></div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="title-block">
      <h1 class="title">APX Training Group</h1>
      <p class="tagline">Performance · Precision · Ascent</p>
    </div>
  </main>

  <!-- Hero lasers that sprint over the composition -->
  <div class="track front" aria-hidden="true">
    <span class="streak" style="--top:33%; --w:46vw; --h:2px; --dur:2.3s; --delay:.5s; --g:6px; --core:rgba(185,232,255,0.9); --head:#ffffff"></span>
    <span class="streak" style="--top:50%; --w:40vw; --h:2px; --dur:2.7s; --delay:1.7s; --g:6px; --core:rgba(170,225,255,0.85); --head:#eaf6ff"></span>
    <span class="streak" style="--top:67%; --w:38vw; --h:2px; --dur:2.5s; --delay:2.9s; --g:6px; --core:rgba(185,232,255,0.9); --head:#ffffff"></span>
  </div>
</body>
</html>
