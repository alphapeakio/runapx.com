  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fa;          /* bright off-white canvas */
      --bg-sheen: #ffffff;    /* pure white bloom in the centre */
      --ink: #0a0e13;         /* near-black for headings */
      --muted: #3d4650;       /* body/tagline — deliberately high contrast */
      --dim: #8b96a3;
      --accent: #0099ff;      /* brand blue — used for glows/fills */
      --accent-ink: #0068c4;  /* deeper blue that holds contrast on white */
      --accent-glow: rgba(0, 153, 255, 0.30);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 200;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Bright bloom behind the content: a pool of pure white in the centre
       fading out to the cooler off-white, with a faint blue wash for depth. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 58% 48% at 50% 40%, var(--bg-sheen) 0%, rgba(255, 255, 255, 0) 72%),
        radial-gradient(ellipse 72% 60% at 50% 46%, rgba(0, 153, 255, 0.05) 0%, transparent 74%);
      pointer-events: none;
    }

    /* Fine grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.16;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.5rem;
    }

    .logo-wrap {
      position: relative;
      opacity: 0;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Soft ambient light behind the wordmark — wide, diffuse and blurred
       so it reads as a gentle bloom rather than a hard blue disc. */
    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -85% -35%;
      background:
        radial-gradient(ellipse 50% 55% at 50% 50%,
          rgba(0, 153, 255, 0.13) 0%,
          rgba(0, 153, 255, 0.07) 30%,
          rgba(0, 153, 255, 0.02) 52%,
          transparent 72%),
        radial-gradient(ellipse 34% 42% at 50% 47%,
          rgba(90, 175, 255, 0.08) 0%,
          transparent 62%);
      filter: blur(18px);
      pointer-events: none;
    }

    .logo {
      position: relative;
      display: block;
      width: min(420px, 80vw);
      aspect-ratio: 1212 / 316;
      /* Use the wordmark shape as an alpha mask so we can fill it
         with a brushed-metal gradient instead of flat white. */
      -webkit-mask: url("/assets/apx-logo.png") center / contain no-repeat;
              mask: url("/assets/apx-logo.png") center / contain no-repeat;
      /* Brushed silver: lifted well above graphite so it reads as polished
         metal rather than dark ink, while the shaded bands stay deep enough
         to hold definition against the off-white canvas. */
      background: linear-gradient(
        176deg,
        #b9c4d1 0%,
        #59646f 14%,
        #93a0ad 30%,
        #3b4550 46%,
        #a9b5c1 58%,
        #4d5763 74%,
        #808c99 100%
      );
      overflow: hidden;
    }

    /* A glint of light that races across the wordmark — speed / performance. */
    .logo::after {
      content: '';
      position: absolute;
      top: -20%;
      bottom: -20%;
      left: -30%;
      width: 20%;
      background: linear-gradient(
        105deg,
        transparent 0%,
        rgba(255, 255, 255, 0.15) 40%,
        rgba(255, 255, 255, 0.95) 50%,
        rgba(255, 255, 255, 0.15) 60%,
        transparent 100%
      );
      transform: skewX(-18deg);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: gloss 6s cubic-bezier(0.7, 0, 0.3, 1) infinite;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--dim), var(--accent), var(--dim), transparent);
      opacity: 0;
      animation: fadeIn 1s ease 0.8s forwards;
    }

    .title-block {
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    .title {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .pronunciation {
      margin-top: 0.75rem;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 200;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .pronunciation span {
      color: var(--accent-ink);
      font-weight: 400;
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: clamp(0.7rem, 1.8vw, 0.8rem);
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Race: light beams that sprint across the track ──
       Each streak has a bright leading head and a motion-blur tail,
       accelerating left→right at its own pace so they overtake. */
    .track {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .track.back  { z-index: 0; }  /* ambient depth, behind the content */
    .track.front { z-index: 2; }  /* hero lasers, over the content     */

    .streak {
      position: absolute;
      left: 0;
      top: var(--top, 50%);
      width: var(--w, 36vw);
      height: var(--h, 2px);
      border-radius: 999px;
      transform-origin: right center;
      transform: translateX(-55vw);
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(0, 153, 255, 0.05) 34%,
        rgba(0, 145, 245, 0.34) 62%,
        var(--core, rgba(0, 132, 232, 0.80)) 86%,
        var(--head, #0072d6) 100%
      );
      filter:
        drop-shadow(0 0 var(--g, 4px) var(--accent-glow))
        drop-shadow(0 0 calc(var(--g, 4px) * 2.4) rgba(0, 153, 255, 0.18));
      animation: race var(--dur, 3s) cubic-bezier(0.5, 0, 0.82, 0.3) var(--delay, 0s) infinite;
      will-change: transform, opacity;
    }

    /* Bright pin-point at the leading edge of each hero beam. */
    .track.front .streak::after {
      content: '';
      position: absolute;
      right: -2px;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      background: var(--accent-ink);
      box-shadow: 0 0 10px 2px rgba(0, 153, 255, 0.55), 0 0 22px 6px var(--accent-glow);
    }

    @keyframes race {
      0%   { transform: translateX(-55vw) scaleX(0.65); opacity: 0; }
      10%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateX(160vw) scaleX(1.25); opacity: 0; }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Light glint sprinting across the wordmark, with a pause between passes */
    @keyframes gloss {
      0%   { left: -30%; opacity: 0; }
      6%   { opacity: 1; }
      32%  { left: 120%; opacity: 1; }
      38%  { left: 120%; opacity: 0; }
      100% { left: 120%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap, .divider, .title-block {
        animation: none;
        opacity: 1;
      }
      .logo::after,
      .track {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient beams for depth, behind the content -->
  <div class="track back" aria-hidden="true">
    <span class="streak" style="--top:24%; --w:34vw; --h:1px; --dur:3.6s; --delay:.2s; --g:3px; --core:rgba(0,140,240,0.42); --head:rgba(0,120,215,0.60)"></span>
    <span class="streak" style="--top:41%; --w:28vw; --h:1px; --dur:4.2s; --delay:1.4s; --g:3px; --core:rgba(0,140,240,0.36); --head:rgba(0,120,215,0.52)"></span>
    <span class="streak" style="--top:63%; --w:40vw; --h:1px; --dur:3.9s; --delay:.7s; --g:3px; --core:rgba(0,140,240,0.42); --head:rgba(0,120,215,0.60)"></span>
    <span class="streak" style="--top:79%; --w:30vw; --h:1px; --dur:4.6s; --delay:2.1s; --g:3px; --core:rgba(0,140,240,0.34); --head:rgba(0,120,215,0.48)"></span>
  </div>

  <main class="page">
    <div class="logo-wrap">
      <div class="logo" role="img" aria-label="APX logo"></div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="title-block">
      <h1 class="title">APX Training Group</h1>
      <p class="tagline">Performance · Precision · Ascent</p>
    </div>
  </main>

  <!-- Hero lasers that sprint over the composition -->
  <div class="track front" aria-hidden="true">
    <span class="streak" style="--top:33%; --w:46vw; --h:2px; --dur:2.3s; --delay:.5s; --g:6px; --core:rgba(0,145,245,0.85); --head:#0068c4"></span>
    <span class="streak" style="--top:50%; --w:40vw; --h:2px; --dur:2.7s; --delay:1.7s; --g:6px; --core:rgba(0,145,245,0.78); --head:#0072d6"></span>
    <span class="streak" style="--top:67%; --w:38vw; --h:2px; --dur:2.5s; --delay:2.9s; --g:6px; --core:rgba(0,145,245,0.85); --head:#0068c4"></span>
  </div>
</body>
