<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APX — Running Group</title>
  <meta name="description" content="APX (Apex) Running Group — precision, pace, and community.">
  <link rel="icon" type="image/png" href="/assets/apx-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #000000;
      --white: #e8e8e8;
      --muted: #666666;
      --accent: #39ff14;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 200;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle radial glow behind content */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(255,255,255,0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Fine grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.5rem;
    }

    .logo {
      width: min(420px, 80vw);
      height: auto;
      opacity: 0;
      animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--muted), transparent);
      opacity: 0;
      animation: fadeIn 1s ease 0.8s forwards;
    }

    .title-block {
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
    }

    .title {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--white);
    }

    .pronunciation {
      margin-top: 0.75rem;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 200;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .pronunciation span {
      color: var(--accent);
      font-weight: 300;
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: clamp(0.7rem, 1.8vw, 0.8rem);
      font-weight: 200;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
    }

    /* Animated scan line */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(57,255,20,0.15), transparent);
      animation: scan 8s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scan {
      0%   { top: -1px; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100dvh; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .divider, .title-block, .scanline {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="scanline" aria-hidden="true"></div>

  <main class="page">
    <img
      src="/assets/apx-logo.png"
      alt="APX logo"
      class="logo"
      width="840"
      height="200"
    >

    <div class="divider" aria-hidden="true"></div>

    <div class="title-block">
      <h1 class="title">Running Group</h1>
      <p class="pronunciation">pronounced <span>Apex</span></p>
      <p class="tagline">Precision · Pace · Community</p>
    </div>
  </main>
</body>
</html>
